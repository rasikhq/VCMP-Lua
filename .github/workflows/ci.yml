name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 (manylinux_2_28)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ci
          file: ci/manylinux.Dockerfile
          tags: vcmp-lua-build
          load: true
          cache-from: type=gha,scope=manylinux
          cache-to: type=gha,mode=max,scope=manylinux

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/x64-linux-plugin.cmake', 'ci/manylinux.Dockerfile') }}
          restore-keys: vcpkg-linux-

      - name: Build, test and check the binary
        run: docker run --rm -v "$PWD:/src" -w /src vcmp-lua-build ci/build-linux.sh

      - name: MySQL gate
        run: docker compose -f tests/integration/compose.yml run --rm mysql-gate

      - name: Stop integration services
        if: always()
        run: docker compose -f tests/integration/compose.yml down --volumes

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LuaPlugin_x64-linux
          path: build/linux-release/bin/LuaPlugin_x64.so
          if-no-files-found: error

  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.cache\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg-archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg-archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/x64-windows-static-plugin.cmake') }}
          restore-keys: vcpkg-windows-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          ci/bootstrap-vcpkg.ps1 $env:VCPKG_ROOT

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Check the binary
        shell: pwsh
        run: ci/check-binary.ps1 build/windows-release/bin/LuaPlugin_x64.dll

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LuaPlugin_x64-windows
          path: build/windows-release/bin/LuaPlugin_x64.dll
          if-no-files-found: error
